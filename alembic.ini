# Migraciones versionadas. Se ejecutan como paso explícito de despliegue:
#   uv run alembic upgrade head
# (en Docker: servicio one-shot "migrate"). El worker NUNCA migra al arrancar.
# Credenciales: solo variables de entorno POSTGRES_* (ver migrations/env.py).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
