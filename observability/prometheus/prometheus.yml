# Prometheus 3: recibe las métricas del worker por OTLP (--web.enable-otlp-receiver)
# y sondea /readyz con blackbox-exporter.
#
# Traducción OTLP -> nombres Prometheus (estrategia por defecto en v3,
# UnderscoreEscapingWithSuffixes; verificada contra v3.15.1, ver README):
#   puntos -> guiones bajos; contadores +_total; unidad como sufijo (s -> _seconds);
#   unidades entre llaves ({item}) se descartan.
#   rpa.transactions          -> rpa_transactions_total
#   rpa.transaction.duration  -> rpa_transaction_duration_seconds_{bucket,sum,count}
#   rpa.alerts                -> rpa_alerts_total
#   rpa.queue.oldest_item_age -> rpa_queue_oldest_item_age_seconds
#   rpa.worker.up             -> rpa_worker_up
#   job = service.name ("rpa-worker"), instance = service.instance.id (CONSUMER_NAME)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

storage:
  tsdb:
    # OTLP empuja muestras que pueden llegar algo desordenadas.
    out_of_order_time_window: 30m

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: rpa-readyz
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://worker:8080/readyz"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
