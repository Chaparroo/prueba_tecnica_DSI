name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (historial completo)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --no-banner --config /repo/.gitleaks.toml

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: ruff
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: mypy
        run: uv run mypy
      - name: pytest (unitarias + integración con testcontainers)
        run: uv run pytest
      - name: pip-audit
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements.txt && uv run pip-audit -r requirements.txt --strict

  smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: smoke sobre docker compose (flujo, SIGTERM y stop a mitad de item)
        run: uv run python scripts/smoke.py
